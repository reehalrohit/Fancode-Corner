<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000000">
    <title>Live Player</title>
<style>
        :root {
            --accent: #4d8dff;
            --panel: rgba(5, 10, 20, .82);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #player-shell {
            position: fixed;
            inset: 0;
            background: #000;
        }

        #video {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .topbar {
            position: fixed;
            z-index: 5000;
            top: max(8px, env(safe-area-inset-top));
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .topbar > * { pointer-events: auto; }

        .back-btn, .live-chip {
            border: 1px solid rgba(255,255,255,.14);
            background: var(--panel);
            color: #fff;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 999px;
        }

        .back-btn {
            border: 0;
            padding: 9px 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .live-chip {
            max-width: 72%;
            padding: 7px 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 650;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b4f;
            flex: 0 0 auto;
        }

        .live-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .player-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .player-actions .back-btn {
            min-width: 40px;
            min-height: 38px;
            padding: 8px 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: fixed;
            z-index: 4000;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0,0,0,.68);
            text-align: center;
        }

        .hidden { display: none !important; }

        .panel {
            width: min(520px, 100%);
            padding: 24px 20px;
            border-radius: 18px;
            background: rgba(12,16,24,.94);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 18px 70px rgba(0,0,0,.5);
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 15px;
            border: 3px solid rgba(255,255,255,.18);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .detail {
            color: #b9c0cc;
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .action-btn {
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 750;
            cursor: pointer;
        }

        .action-btn.secondary {
            background: #151b27;
            border: 1px solid rgba(255,255,255,.15);
        }

        .shaka-video-wrapper {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }

        .shaka-video-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            background: #000 !important;
        }
    </style>
</head>

<body>
<div id="player-shell">

    <div class="topbar">
        <button id="backBtn" class="back-btn" type="button">← Back</button>
        <div class="live-chip">
            <span class="live-dot"></span>
            <span id="liveTitle" class="live-title">Live Player</span>
        </div>
        <div class="player-actions">
            <button id="shareBtn" class="back-btn appmint-action" data-appmint-haptic="true" type="button" aria-label="Share event">↗</button>
            <button id="pipBtn" class="back-btn appmint-action" data-appmint-haptic="true" type="button" aria-label="Picture in picture">▣</button>
            <button id="fullscreenBtn" class="back-btn appmint-action" data-appmint-haptic="true" type="button" aria-label="Fullscreen">⛶</button>
        </div>
    </div>

    <video id="video"
           controls
           playsinline
           muted
           preload="metadata"></video>

    <div id="loading" class="overlay">
        <div class="panel">
            <div class="spinner"></div>
            <div class="title">Loading live stream</div>
            <div id="loadingDetail" class="detail">Preparing the HLS player…</div>
        </div>
    </div>

    <div id="error" class="overlay hidden">
        <div class="panel">
            <div class="title">Unable to play this stream</div>
            <div id="errorText" class="detail"></div>
            <div class="actions">
                <button id="retryBtn" class="action-btn" type="button">Retry</button>
                <button id="externalBtn" class="action-btn secondary" type="button">Open in NS Player</button>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/shaka-player/5.2.12/shaka-player.compiled.js"></script>
<script src="/appmint-v04.js"></script>

<script>
(() => {
    "use strict";

    const params = new URLSearchParams(location.search);

    const streamUrl = params.get("stream") || "";
    const title = params.get("title") || "Live Sports Event";
    const source = params.get("source") || "";
    const poster = params.get("poster") || "";

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const loadingDetail = document.getElementById("loadingDetail");
    const errorOverlay = document.getElementById("error");
    const errorText = document.getElementById("errorText");
    const liveTitle = document.getElementById("liveTitle");

    const retryBtn = document.getElementById("retryBtn");
    const externalBtn = document.getElementById("externalBtn");
    const shareBtn = document.getElementById("shareBtn");
    const pipBtn = document.getElementById("pipBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    let player = null;
    let started = false;
    let startupTimer = null;

    document.title = `${title} | Live Player`;

    if (liveTitle) {
        liveTitle.textContent = source
            ? `${source} - ${title}`
            : title;
    }

    if (poster) {
        video.poster = poster;
    }

    function showLoading(message) {
        if (loadingDetail) {
            loadingDetail.textContent =
                message || "Preparing the Shaka player...";
        }

        loading?.classList.remove("hidden");
        errorOverlay?.classList.add("hidden");
    }

    function hideLoading() {
        loading?.classList.add("hidden");
    }

    function showError(message) {
        clearTimeout(startupTimer);
        hideLoading();

        if (errorText) {
            errorText.textContent = message;
        }

        errorOverlay?.classList.remove("hidden");
    }

    function isMediaUrl(url) {
        try {
            const u = new URL(url);

            if (u.protocol !== "https:" && u.protocol !== "http:") {
                return false;
            }

            return /\.m3u8(?:$|[?#])/i.test(
                u.pathname + u.search
            ) || /\.mpd(?:$|[?#])/i.test(
                u.pathname + u.search
            );
        } catch {
            return false;
        }
    }

    function describeError(error) {
        if (!error) {
            return "The browser could not start the stream.";
        }

        const code = error.code;

        if (code === 1001) {
            return "The stream could not be loaded.";
        }

        if (code === 1002) {
            return "The stream format is not supported by this browser.";
        }

        if (code === 1003) {
            return "The stream could not be decoded.";
        }

        if (code === 1004) {
            return "The stream could not be downloaded.";
        }

        if (code === 1006) {
            return "The stream is not available or has expired.";
        }

        return error.message ||
            "Shaka Player reported a playback error.";
    }

    function openNSPlayer() {
        if (!streamUrl) {
            return;
        }

        const cleanUrl = streamUrl.replace(/^https?:\/\//i, "");

        const intent =
            `intent://${cleanUrl}` +
            "#Intent;" +
            "package=com.genuine.leone;" +
            "action=android.intent.action.VIEW;" +
            "scheme=https;" +
            `S.browser_fallback_url=${encodeURIComponent(streamUrl)};` +
            "end;";

        try {
            location.href = intent;
        } catch {
            location.href = streamUrl;
        }
    }

    async function destroyPlayer() {
        clearTimeout(startupTimer);

        if (player) {
            try {
                await player.destroy();
            } catch (error) {
                console.debug("Shaka Player destroy:", error);
            }
        }

        player = null;

        try {
            video.pause();
        } catch (error) {
            console.debug("Video pause:", error);
        }

        video.removeAttribute("src");
        video.load();
    }

    async function init() {
        clearTimeout(startupTimer);

        started = false;

        if (!streamUrl) {
            showError("No stream URL was supplied.");
            return;
        }

        if (!isMediaUrl(streamUrl)) {
            showError(
                "The supplied URL is not a supported HLS (.m3u8) " +
                "or DASH (.mpd) media URL."
            );
            return;
        }

        if (!window.shaka) {
            showError(
                "Shaka Player could not be loaded. " +
                "Check the network connection and retry."
            );
            return;
        }

        if (!shaka.Player.isBrowserSupported()) {
            showError(
                "This browser does not support Shaka Player " +
                "or the required media features."
            );
            return;
        }

        await destroyPlayer();

        showLoading("Connecting to the live stream...");

        player = new shaka.Player(video);

        player.addEventListener("error", event => {
            console.error(
                "[Player] Shaka error:",
                event.detail
            );

            if (!started) {
                showError(describeError(event.detail));
            } else {
                console.warn(
                    "[Player] Playback interruption:",
                    event.detail
                );
            }
        });

        try {
            await player.load(streamUrl);

            /*
             * Muted startup helps Android/WebView autoplay.
             * The user can unmute using the native/browser controls.
             */
            video.muted = true;
            video.playsInline = true;

            hideLoading();

            startupTimer = setTimeout(() => {
                if (!started) {
                    showError(
                        "The stream was loaded but playback did not start. " +
                        "Press Play or use NS Player."
                    );
                }
            }, 15000);

            try {
                await video.play();
            } catch (error) {
                console.debug(
                    "[Player] Autoplay prevented:",
                    error
                );

                if (loadingDetail) {
                    loadingDetail.textContent =
                        "Stream is ready. Press Play to start playback.";
                }
            }

        } catch (error) {
            console.error("[Player] Shaka load error:", error);
            showError(describeError(error));
        }
    }

    retryBtn?.addEventListener("click", () => {
        errorOverlay?.classList.add("hidden");
        init();
    });

    externalBtn?.addEventListener("click", openNSPlayer);

    shareBtn?.addEventListener("click", async () => {
        const shareUrl = location.href;

        try {
            const result = window.AppMintV04
                ? await window.AppMintV04.share(
                    title,
                    `Watch ${title}`,
                    shareUrl
                )
                : false;

            if (result === "copied") {
                showLoading("Player link copied to clipboard.");
                setTimeout(hideLoading, 900);
                return;
            }
        } catch (error) {
            console.debug("[Player] Share failed:", error);
        }

        try {
            await navigator.clipboard.writeText(shareUrl);
            showLoading("Player link copied to clipboard.");
            setTimeout(hideLoading, 900);
        } catch {
            showError("Unable to copy the player link.");
        }
    });

    pipBtn?.addEventListener("click", async () => {
        try {
            if (window.AppMintV04) {
                const opened = await window.AppMintV04.videoPip(video);

                if (!opened) {
                    pipBtn.hidden = true;
                }

                return;
            }

            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else if (document.pictureInPictureEnabled) {
                await video.requestPictureInPicture();
            }
        } catch (error) {
            console.debug("[Player] PiP failed:", error);
        }
    });

    fullscreenBtn?.addEventListener("click", async () => {
        try {
            if (window.AppMintV04) {
                const enabled = !window.AppMintV04.isFullscreen();

                await window.AppMintV04.fullscreen(enabled);

                fullscreenBtn.textContent = enabled ? "×" : "⛶";

                if (enabled && screen.orientation?.lock) {
                    try {
                        await screen.orientation.lock("landscape");
                    } catch {}
                } else if (!enabled && screen.orientation?.unlock) {
                    try {
                        screen.orientation.unlock();
                    } catch {}
                }

                return;
            }

            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
                fullscreenBtn.textContent = "×";
            } else {
                await document.exitFullscreen();
                fullscreenBtn.textContent = "⛶";
            }
        } catch (error) {
            console.debug("[Player] Fullscreen failed:", error);
        }
    });

    video.addEventListener("playing", () => {
        started = true;
        clearTimeout(startupTimer);
        hideLoading();
    });

    video.addEventListener("canplay", () => {
        if (!started && loadingDetail) {
            loadingDetail.textContent =
                "Stream is ready — starting playback...";
        }
    });

    video.addEventListener("waiting", () => {
        if (!started && loadingDetail) {
            loadingDetail.textContent =
                "Waiting for the live stream...";
        }
    });

    video.addEventListener("stalled", () => {
        if (!started && loadingDetail) {
            loadingDetail.textContent =
                "The stream is taking longer than expected...";
        }
    });

    video.addEventListener("error", () => {
        if (!started) {
            showError(
                "The browser reported a media playback error. " +
                "Try NS Player."
            );
        }
    });

    document.getElementById("backBtn")?.addEventListener(
        "click",
        () => {
            if (history.length > 1) {
                history.back();
            } else {
                location.href = "index.html";
            }
        }
    );

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && started && video.paused) {
            video.play().catch(() => {});
        }
    });

    window.addEventListener("beforeunload", () => {
        destroyPlayer();
    });

    init();
})();
</script>
</body>
</html>
