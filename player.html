<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000000">
    <title>Live Player</title>

    <link rel="stylesheet"
          href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css">
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

    <style>
        :root {
            --accent: #4d8dff;
            --panel: rgba(5, 10, 20, .82);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #player-shell {
            position: fixed;
            inset: 0;
            background: #000;
        }

        #video {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .topbar {
            position: fixed;
            z-index: 5000;
            top: max(8px, env(safe-area-inset-top));
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .topbar > * { pointer-events: auto; }

        .back-btn, .live-chip {
            border: 1px solid rgba(255,255,255,.14);
            background: var(--panel);
            color: #fff;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 999px;
        }

        .back-btn {
            border: 0;
            padding: 9px 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .live-chip {
            max-width: 72%;
            padding: 7px 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 650;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b4f;
            flex: 0 0 auto;
        }

        .live-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .overlay {
            position: fixed;
            z-index: 4000;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0,0,0,.68);
            text-align: center;
        }

        .hidden { display: none !important; }

        .panel {
            width: min(520px, 100%);
            padding: 24px 20px;
            border-radius: 18px;
            background: rgba(12,16,24,.94);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 18px 70px rgba(0,0,0,.5);
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 15px;
            border: 3px solid rgba(255,255,255,.18);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .detail {
            color: #b9c0cc;
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .action-btn {
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 750;
            cursor: pointer;
        }

        .action-btn.secondary {
            background: #151b27;
            border: 1px solid rgba(255,255,255,.15);
        }

        .fluid_video_wrapper {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }

        .fluid_video_wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            background: #000 !important;
        }
    </style>
</head>

<body>
<div id="player-shell">

    <div class="topbar">
        <button id="backBtn" class="back-btn" type="button">← Back</button>
        <div class="live-chip">
            <span class="live-dot"></span>
            <span id="liveTitle" class="live-title">Live Player</span>
        </div>
    </div>

    <video id="video"
           controls
           playsinline
           muted
           preload="metadata"></video>

    <div id="loading" class="overlay">
        <div class="panel">
            <div class="spinner"></div>
            <div class="title">Loading live stream</div>
            <div id="loadingDetail" class="detail">Preparing the HLS player…</div>
        </div>
    </div>

    <div id="error" class="overlay hidden">
        <div class="panel">
            <div class="title">Unable to play this stream</div>
            <div id="errorText" class="detail"></div>
            <div class="actions">
                <button id="retryBtn" class="action-btn" type="button">Retry</button>
                <button id="externalBtn" class="action-btn secondary" type="button">Open in NS Player</button>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    "use strict";

    const params = new URLSearchParams(location.search);
    const streamUrl = params.get("stream") || "";
    const title = params.get("title") || "Live Sports Event";
    const source = params.get("source") || "";
    const poster = params.get("poster") || "";

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const loadingDetail = document.getElementById("loadingDetail");
    const errorOverlay = document.getElementById("error");
    const errorText = document.getElementById("errorText");
    const liveTitle = document.getElementById("liveTitle");
    const retryBtn = document.getElementById("retryBtn");
    const externalBtn = document.getElementById("externalBtn");

    let player = null;
    let started = false;
    let startupTimer = null;

    document.title = `${title} | Live Player`;
    liveTitle.textContent = source ? `${source} • ${title}` : title;

    if (poster) video.poster = poster;

    function showLoading(message) {
        loadingDetail.textContent = message || "Preparing the HLS player…";
        loading.classList.remove("hidden");
        errorOverlay.classList.add("hidden");
    }

    function hideLoading() {
        loading.classList.add("hidden");
    }

    function showError(message) {
        clearTimeout(startupTimer);
        hideLoading();
        errorText.textContent = message;
        errorOverlay.classList.remove("hidden");
    }

    function isHlsUrl(url) {
        try {
            const u = new URL(url);
            return (u.protocol === "https:" || u.protocol === "http:")
                && /\.m3u8(?:$|[?#])/i.test(u.pathname + u.search);
        } catch {
            return false;
        }
    }

    function describeError() {
        const e = video.error;
        if (!e) return "The browser could not start the HLS stream.";

        if (e.code === MediaError.MEDIA_ERR_NETWORK) {
            return "The browser could not fetch the HLS stream. The source may require request headers, cookies, or browser access permission.";
        }
        if (e.code === MediaError.MEDIA_ERR_DECODE) {
            return "The stream was received but the browser could not decode it.";
        }
        if (e.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
            return "This HLS source is not playable by the browser.";
        }
        if (e.code === MediaError.MEDIA_ERR_ABORTED) {
            return "The browser aborted the stream request.";
        }

        return "The browser reported an HLS playback error.";
    }

    function openNSPlayer() {
        if (!streamUrl) return;

        const cleanUrl = streamUrl.replace(/^https?:\/\//i, "");
        const intent =
            `intent://${cleanUrl}` +
            `#Intent;package=com.genuine.leone;` +
            `action=android.intent.action.VIEW;` +
            `scheme=https;` +
            `S.browser_fallback_url=${encodeURIComponent(streamUrl)};end;`;

        location.href = intent;
    }

    function destroyPlayer() {
        clearTimeout(startupTimer);

        if (player && typeof player.destroy === "function") {
            try { player.destroy(); } catch (_) {}
        }

        player = null;
        video.pause();
        video.removeAttribute("src");
        video.load();
    }

    function init() {
        clearTimeout(startupTimer);
        started = false;

        if (!streamUrl) {
            showError("No stream URL was supplied.");
            return;
        }

        if (!isHlsUrl(streamUrl)) {
            showError("The supplied stream URL is not a valid HLS (.m3u8) URL.");
            return;
        }

        if (typeof fluidPlayer !== "function") {
            showError("Fluid Player could not be loaded. Check the network connection and retry.");
            return;
        }

        destroyPlayer();
        showLoading("Connecting to the live HLS source…");

        /*
         * Give Fluid Player the HLS source directly.
         * Do not repeatedly destroy/recreate the player.
         */
        video.src = streamUrl;
        video.muted = true;
        video.playsInline = true;

        try {
            player = fluidPlayer("video", {
                layoutControls: {
                    autoPlay: true,
                    mute: true,
                    fillToContainer: true,
                    posterImage: poster || "",
                    playButtonShowing: true,
                    allowTheatre: false,
                    allowDownload: false,
                    playbackRateEnabled: false,
                    controlBar: {
                        autoHide: true,
                        autoHideTimeout: 3,
                        animated: true
                    }
                },
                vastOptions: {
                    adList: []
                }
            });
        } catch (err) {
            console.error("Fluid Player initialization error:", err);
            showError("Fluid Player failed to initialize. Try NS Player.");
            return;
        }

        /*
         * One timeout only. It reports the failure instead of creating
         * an endless initialization loop.
         */
        startupTimer = setTimeout(() => {
            if (!started) {
                showError(
                    "The HLS stream did not start in the browser. " +
                    "The stream URL may have expired or the source may not permit browser playback."
                );
            }
        }, 15000);

        /*
         * Ask the browser to begin playback. Muted autoplay is used so
         * Android WebView/browser autoplay restrictions are less likely
         * to block startup.
         */
        video.play().catch(() => {
            loadingDetail.textContent =
                "Stream is ready. Press the play button to start playback.";
        });
    }

    video.addEventListener("playing", () => {
        started = true;
        clearTimeout(startupTimer);
        hideLoading();
    });

    video.addEventListener("canplay", () => {
        if (!started) {
            loadingDetail.textContent = "Stream is ready — starting playback…";
        }
    });

    video.addEventListener("waiting", () => {
        if (!started) {
            loadingDetail.textContent = "Waiting for the live stream…";
        }
    });

    video.addEventListener("stalled", () => {
        if (!started) {
            loadingDetail.textContent = "The stream server is taking longer than expected…";
        }
    });

    video.addEventListener("error", () => {
        if (!started) {
            showError(describeError());
        } else {
            console.warn("Playback interruption:", describeError());
        }
    });

    retryBtn.addEventListener("click", init);
    externalBtn.addEventListener("click", openNSPlayer);

    document.getElementById("backBtn").addEventListener("click", () => {
        if (history.length > 1) history.back();
        else location.href = "index.html";
    });

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && started && video.paused) {
            video.play().catch(() => {});
        }
    });

    init();
})();
</script>
</body>
</html>
