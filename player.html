<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000000">
    <title>Live Player</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shaka Player 4.6.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

    <style>
        :root {
            --accent: #4d8dff;
            --panel: rgba(5, 10, 20, .78);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Poppins, system-ui, sans-serif;
        }

        .video-container,
        .shaka-video-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .topbar {
            position: fixed;
            z-index: 3000;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .topbar > * { pointer-events: auto; }

        .back-btn,
        .live-chip {
            border: 1px solid rgba(255,255,255,.12);
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #fff;
            border-radius: 999px;
        }

        .back-btn {
            border: 0;
            padding: 10px 14px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }

        .back-btn:active { transform: scale(.97); }

        .live-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            max-width: 65%;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b4f;
            box-shadow: 0 0 0 5px rgba(255,59,79,.14);
            flex: 0 0 auto;
        }

        .live-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            font-weight: 600;
        }

        .loading-overlay,
        .error-overlay {
            position: absolute;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
            background:
                radial-gradient(circle at center, rgba(35,65,120,.16), transparent 32%),
                #000;
            transition: opacity .25s ease;
        }

        .loading-overlay.hidden,
        .error-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255,255,255,.16);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .9s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .error-text {
            color: #9ca3af;
            font-size: 13px;
            max-width: 420px;
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .retry-btn {
            border: 0;
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            padding: 10px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .topbar {
                top: max(8px, env(safe-area-inset-top));
                left: 8px;
                right: 8px;
            }
            .back-btn { padding: 9px 12px; }
            .live-chip { max-width: 58%; }
        }
    </style>
</head>

<body>
    <div class="video-container">
        <div class="topbar">
            <button id="backBtn" class="back-btn" type="button">← Back</button>
            <div class="live-chip" title="Live stream">
                <span class="live-dot"></span>
                <span id="liveTitle" class="live-title">Live Player</span>
            </div>
        </div>

        <div class="shaka-video-container" data-shaka-player>
            <video id="video" autoplay playsinline muted></video>

            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <div>Loading live stream…</div>
            </div>

            <div id="error" class="error-overlay hidden">
                <div class="error-title">Unable to play this stream</div>
                <div id="errorText" class="error-text">
                    The stream may be offline, expired, or unsupported by the browser.
                </div>
                <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">
                    <button id="retryBtn" class="retry-btn" type="button">Retry</button>
                    <button id="externalBtn" class="retry-btn" type="button"
                        style="background:#111827;border:1px solid rgba(255,255,255,.16);">
                        Open Externally
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const streamUrl = params.get("stream") || "";
        const title = params.get("title") || "Live Player";
        const source = params.get("source") || "";

        const video = document.getElementById("video");
        const loading = document.getElementById("loading");
        const errorOverlay = document.getElementById("error");
        const errorText = document.getElementById("errorText");
        const liveTitle = document.getElementById("liveTitle");

        document.title = `${title} | Live Player`;
        liveTitle.textContent = source ? `${source} • ${title}` : title;

        document.getElementById("backBtn").addEventListener("click", () => {
            if (history.length > 1) history.back();
            else window.location.href = "index.html";
        });

        function showLoading() {
            errorOverlay.classList.add("hidden");
            loading.classList.remove("hidden");
        }

        function hideLoading() {
            loading.classList.add("hidden");
        }

        function showError(message) {
            hideLoading();
            errorText.textContent = message || "The stream could not be loaded.";
            errorOverlay.classList.remove("hidden");
        }

        function isValidStreamUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === "https:" || url.protocol === "http:";
            } catch {
                return false;
            }
        }

        function openExternally() {
            if (!streamUrl) return;

            // Android intent fallback. If the dedicated player app is not
            // installed, fall back to opening the URL in the browser.
            const cleanUrl = streamUrl.replace(/^https?:\\/\\//, "");
            const intentUrl =
                `intent://${cleanUrl}` +
                `#Intent;package=com.genuine.leone;` +
                `action=android.intent.action.VIEW;` +
                `scheme=https;` +
                `S.browser_fallback_url=${encodeURIComponent(streamUrl)};end;`;

            window.location.href = intentUrl;
        }

        let player = null;

        function isHlsUrl(value) {
            return /\.m3u8(?:$|[?#])/i.test(value);
        }

        function isNativeHlsSupported() {
            const probe = document.createElement("video");
            return !!probe.canPlayType("application/vnd.apple.mpegurl") ||
                   !!probe.canPlayType("application/x-mpegURL");
        }

        async function tryNativePlayback() {
            if (!isHlsUrl(streamUrl) || !isNativeHlsSupported()) {
                return false;
            }

            try {
                video.controls = true;
                video.src = streamUrl;
                video.muted = true;

                await new Promise((resolve, reject) => {
                    const onPlaying = () => {
                        cleanup();
                        resolve();
                    };
                    const onError = () => {
                        cleanup();
                        reject(video.error || new Error("Native playback failed"));
                    };
                    const cleanup = () => {
                        video.removeEventListener("playing", onPlaying);
                        video.removeEventListener("error", onError);
                    };

                    video.addEventListener("playing", onPlaying, { once: true });
                    video.addEventListener("error", onError, { once: true });
                    video.load();
                    video.play().catch(() => {});

                    setTimeout(() => {
                        cleanup();
                        reject(new Error("Native HLS playback timed out"));
                    }, 9000);
                });

                hideLoading();
                return true;
            } catch (error) {
                console.warn("Native HLS playback failed:", error);
                video.pause();
                video.removeAttribute("src");
                video.load();
                return false;
            }
        }

        async function tryShakaPlayback() {
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                throw new Error("Shaka Player is not supported in this browser.");
            }

            player = new shaka.Player(video);
            const container = document.querySelector(".shaka-video-container");
            const ui = new shaka.ui.Overlay(player, container, video);

            ui.configure({
                controlPanelElements: [
                    "play_pause",
                    "mute",
                    "time_and_duration",
                    "spacer",
                    "quality",
                    "language",
                    "picture_in_picture",
                    "fullscreen",
                    "overflow_menu"
                ],
                addSeekBar: true
            });

            player.configure({
                streaming: {
                    bufferingGoal: 10,
                    rebufferingGoal: 2,
                    bufferBehind: 30,
                    lowLatencyMode: false,
                    retryParameters: {
                        maxAttempts: 4,
                        baseDelay: 1000,
                        backoffFactor: 1.5,
                        fuzzFactor: 0.5
                    }
                },
                manifest: {
                    retryParameters: {
                        maxAttempts: 4,
                        baseDelay: 1000,
                        backoffFactor: 1.5,
                        fuzzFactor: 0.5
                    }
                }
            });

            player.addEventListener("error", (event) => {
                const detail = event.detail || {};
                console.error("Shaka error:", detail);
            });

            video.addEventListener("playing", hideLoading, { once: true });

            await player.load(streamUrl);

            video.muted = true;
            await video.play().catch(() => {});

            setTimeout(() => {
                if (!video.paused) hideLoading();
            }, 1200);
        }

        async function initPlayer() {
            showLoading();

            if (!streamUrl || !isValidStreamUrl(streamUrl)) {
                showError("A valid HTTP(S) stream URL is required.");
                return;
            }

            // Android browsers can often play HLS natively even when MSE/CORS
            // makes a JavaScript HLS player fail. Try that path first.
            const nativeWorked = await tryNativePlayback();
            if (nativeWorked) return;

            // Then use Shaka for browsers that need MSE/HLS parsing.
            try {
                if (player) {
                    try { await player.destroy(); } catch {}
                    player = null;
                }

                await tryShakaPlayback();
                return;
            } catch (error) {
                console.error("Shaka initialization/playback error:", error);

                const code = error && (error.code || (error.detail && error.detail.code));

                let detail;
                if (Number(code) === 1002) {
                    detail =
                        "The browser could not complete the stream request (Shaka HTTP_ERROR 1002). " +
                        "For cross-origin HLS this can happen when the stream origin blocks browser requests " +
                        "with CORS, the signed URL is no longer valid, or the network connection is rejected. " +
                        "Try Retry or Open Externally.";
                } else if (Number(code)) {
                    detail =
                        `The player reported error ${code}. ` +
                        "The stream may be unavailable, expired, unsupported, or blocked by the stream server.";
                } else {
                    detail =
                        "The stream could not be loaded. It may be unavailable, expired, unsupported, " +
                        "or blocked by the stream server.";
                }

                showError(detail);
            }
        }

        document.getElementById("externalBtn").addEventListener("click", openExternally);

        document.getElementById("retryBtn").addEventListener("click", async () => {
            if (player) {
                try { await player.destroy(); } catch {}
                player = null;
            }
            video.pause();
            video.removeAttribute("src");
            video.removeAttribute("controls");
            video.load();
            await initPlayer();
        });

        if ("mediaSession" in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title,
                artist: source || "Live Sports",
                album: "Sports Corner"
            });
        }

        document.addEventListener("DOMContentLoaded", initPlayer);
    </script>
</body>
</html>
