<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanCode Corner | Live Sports</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #22c55e; --accent-hover: #16a34a; --blue: #3b82f6; --blue-hover: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 5px; background: -webkit-linear-gradient(#3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 0.95rem; }
        
        .alert-banner { background-color: rgba(59, 130, 246, 0.1); border: 1px solid var(--blue); color: #bfdbfe; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 30px; font-size: 0.9rem; }
        .alert-banner a { color: var(--blue); font-weight: bold; text-decoration: none; }
        .alert-banner a:hover { text-decoration: underline; }

        #status { text-align: center; margin-bottom: 20px; font-weight: bold; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card-img-container { width: 100%; height: 160px; background-color: #334155; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .live-badge { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; animation: pulse 2s infinite; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .match-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .button-group { display: flex; gap: 10px; margin-top: auto; }
        .btn { flex: 1; display: block; text-align: center; background-color: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.95rem; transition: 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-blue { background-color: var(--blue); }
        .btn-blue:hover { background-color: var(--blue-hover); }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Telegram Pop-up Overlay */
        #mz-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .mz-modal { background: var(--card-bg); padding: 40px 30px; border-radius: 16px; text-align: center; border: 2px solid var(--blue); box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-width: 90%; width: 400px; }
        .mz-modal h2 { font-size: 1.6rem; margin-bottom: 25px; color: var(--text-main); line-height: 1.4; text-transform: uppercase; letter-spacing: 1px; }
        .mz-btn { display: inline-block; background: #0088cc; color: white; text-decoration: none; padding: 14px 40px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.2s; border: none; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4); }
        .mz-btn:hover { background: #0077b5; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6); }
    </style>
</head>
<body>
    <!-- Forced Pop-up -->
    <div id="mz-overlay">
        <div class="mz-modal">
            <h2>Created BY MODZONE TELEGRAM CHANNEL</h2>
            <button id="mz-join-btn" class="mz-btn">Join</button>
        </div>
    </div>

    <!-- Main Content (Hidden until click) -->
    <div id="main-content" style="display: none;">
        <header>
            <h1>FanCode Corner</h1>
            <p>Live matches aggregated from community sources</p>
        </header>

        <div class="alert-banner">
            💡 <strong>Note:</strong> Due to security restrictions, streams will not play in Chrome. Tap <strong>Open App</strong> to play seamlessly in <a href="https://play.google.com/store/apps/details?id=com.pratyush.nsplayer" target="_blank">NS Player</a>.
        </div>
        
        <div id="status">Connecting to server API...</div>
        <div class="grid" id="match-grid"></div>
    </div>

    <script>
        const grid = document.getElementById('match-grid');
        const status = document.getElementById('status');
        const overlay = document.getElementById('mz-overlay');
        const mainContent = document.getElementById('main-content');
        const joinBtn = document.getElementById('mz-join-btn');
        
        let unlocked = false;

        // Unlock site and load API ONLY when the join button is specifically clicked
        joinBtn.addEventListener('click', () => {
            window.open('https://t.me/modzone01', '_blank');
            overlay.style.display = 'none';
            mainContent.style.display = 'block';
            unlocked = true;
            fetchStreams();
        });

        // Anti-Adblock & Anti-Bypass Guard
        // Checks every second: if the user forces the overlay closed via Inspect Element, wipe the site data.
        setInterval(() => {
            if (!unlocked && !document.getElementById('mz-overlay')) {
                document.body.innerHTML = '<h2 style="color:#ef4444; text-align:center; margin-top:100px; font-family:sans-serif;">Access Denied. Please disable adblockers and do not block the pop-up.</h2>';
            }
        }, 1000);

        async function fetchStreams() {
            try {
                const res = await fetch('/api/streams');
                const data = await res.json();

                if (data.status !== 'success' || !data.matches || data.matches.length === 0) {
                    status.style.display = 'block';
                    status.textContent = 'No live matches found at the moment.';
                    return;
                }

                status.style.display = 'none';
                grid.innerHTML = '';

                data.matches.forEach((match) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const imgTag = match.src_image 
                        ? `<img src="${match.src_image}" alt="Thumbnail" class="card-img" onerror="this.style.display='none'">` 
                        : '';

                    const cleanUrl = match.stream_url.replace(/^https?:\/\//, '');
                    const intentUrl = `intent://${cleanUrl}#Intent;action=android.intent.action.VIEW;scheme=https;type=application/x-mpegURL;end;`;

                    card.innerHTML = `
                        <div class="card-img-container">
                            ${imgTag}
                            <div class="live-badge">LIVE</div>
                        </div>
                        <div class="card-content">
                            <div class="match-title">${match.title}</div>
                            <div class="button-group">
                                <a href="${intentUrl}" class="btn">▶ Open App</a>
                                <button class="btn btn-blue" onclick="copyToClipboard('${match.stream_url}')">📋 Copy</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                status.textContent = 'Failed to load streams from API. Please try again later.';
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link Copied! Open NS Player or Televizo and paste the link to play.');
            }).catch(() => {
                alert('Failed to copy. URL: ' + text);
            });
        }
    </script>
</body>
</html>
