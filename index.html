<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanCode Corner | Live Sports</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #22c55e; --accent-hover: #16a34a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2rem; margin-bottom: 5px; background: -webkit-linear-gradient(#3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 0.95rem; }
        #status { text-align: center; margin-bottom: 20px; font-weight: bold; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; transition: transform 0.2s; }
        .card-img-container { width: 100%; height: 160px; background-color: #334155; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .live-badge { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; animation: pulse 2s infinite; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .match-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn { margin-top: auto; display: block; width: 100%; text-align: center; background-color: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background-color: var(--accent-hover); }
        
        /* Fullscreen Player Styles */
        #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
        #close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 6px; z-index: 1000; font-weight: bold; cursor: pointer; }
        #video-player { width: 100%; height: 100%; outline: none; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <header>
        <h1>FanCode Corner</h1>
        <p>Live matches aggregated from community sources</p>
    </header>
    
    <div id="status">Connecting to server API...</div>
    <div class="grid" id="match-grid"></div>

    <!-- Integrated Web Player -->
    <div id="player-modal">
        <button id="close-btn" onclick="closePlayer()">Close Player</button>
        <video id="video-player" controls autoplay></video>
    </div>

    <script>
        const grid = document.getElementById('match-grid');
        const status = document.getElementById('status');
        const playerModal = document.getElementById('player-modal');
        const video = document.getElementById('video-player');
        let hlsInstance = null;

        async function fetchStreams() {
            try {
                const res = await fetch('/api/streams');
                const data = await res.json();

                if (data.status !== 'success' || !data.matches || data.matches.length === 0) {
                    status.style.display = 'block';
                    status.textContent = 'No live matches found at the moment.';
                    return;
                }

                status.style.display = 'none';
                grid.innerHTML = '';

                data.matches.forEach((match) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const imgTag = match.src_image 
                        ? `<img src="${match.src_image}" alt="Thumbnail" class="card-img" onerror="this.style.display='none'">` 
                        : '';

                    card.innerHTML = `
                        <div class="card-img-container">
                            ${imgTag}
                            <div class="live-badge">LIVE</div>
                        </div>
                        <div class="card-content">
                            <div class="match-title">${match.title}</div>
                            <button class="btn" onclick="openPlayer('${match.stream_url}')">Play</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                status.textContent = 'Failed to load streams from API. Please try again later.';
            }
        }

        function openPlayer(url) {
            playerModal.style.display = 'block';
            
            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Fallback for native Safari
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }

        function closePlayer() {
            playerModal.style.display = 'none';
            video.pause();
            video.src = '';
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        fetchStreams();
    </script>
</body>
</html>
