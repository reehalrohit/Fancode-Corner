<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanCode Corner | Live Sports</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #22c55e; --accent-hover: #16a34a; --blue: #3b82f6; --blue-hover: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 5px; background: -webkit-linear-gradient(#3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 0.95rem; }
        
        .alert-banner { background-color: rgba(59, 130, 246, 0.1); border: 1px solid var(--blue); color: #bfdbfe; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 30px; font-size: 0.9rem; }
        .alert-banner a { color: var(--blue); font-weight: bold; text-decoration: none; }
        
        #status { text-align: center; margin-bottom: 20px; font-weight: bold; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; transition: transform 0.2s; }
        .card-img-container { width: 100%; height: 160px; background-color: #334155; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .live-badge { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; animation: pulse 2s infinite; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .match-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .button-group { display: flex; gap: 10px; margin-top: auto; }
        .btn { flex: 1; display: block; text-align: center; background-color: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.95rem; }
        .btn-blue { background-color: var(--blue); }
        
        /* Telegram Pop-up Overlay */
        #mz-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .mz-modal { background: linear-gradient(145deg, #1e293b, #0f172a); padding: 40px 30px; border-radius: 24px; text-align: center; border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 30px rgba(42, 171, 238, 0.15); max-width: 90%; width: 360px; position: relative; overflow: hidden; }
        .mz-modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #2AABEE, #229ED9); }
        .mz-icon { width: 64px; height: 64px; margin: 0 auto 20px; background: #2AABEE; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(42, 171, 238, 0.3); }
        .mz-icon svg { width: 34px; height: 34px; fill: white; margin-right: 3px; margin-top: 2px; }
        .mz-modal h2 { font-size: 1.2rem; margin-bottom: 8px; color: #cbd5e1; line-height: 1.4; font-weight: 600; letter-spacing: 0.5px; }
        .mz-highlight { color: #f8fafc; font-weight: 800; font-size: 1.8rem; display: block; margin: 5px 0; letter-spacing: 1px; }
        .mz-modal p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .mz-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #2AABEE; color: white; text-decoration: none; padding: 14px 40px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; border: none; width: 100%; box-shadow: 0 4px 15px rgba(42, 171, 238, 0.4); }
        
        /* Security Block Card */
        .block-card { background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2); max-width: 420px; width: 90%; text-align: left; font-family: system-ui, sans-serif; }
        .block-card h2 { color: #ef4444; margin-bottom: 10px; font-size: 1.4rem; text-align: center; }
        .block-card p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 20px; text-align: center; }
        .fix-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; color: #94a3b8; font-size: 0.9rem; line-height: 1.6; border-left: 4px solid #ef4444; }
        .fix-box b { color: #f8fafc; }
        .error-log { background: rgba(239, 68, 68, 0.1); border: 1px dashed #ef4444; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #fca5a5; margin-bottom: 15px; word-break: break-all; }
    </style>
</head>
<body>
    <noscript>
        <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:999999;display:flex;justify-content:center;align-items:center;">
            <div class="block-card">
                <h2>🚨 JavaScript Disabled</h2>
                <p>Your browser is blocking the scripts required to run this site securely.</p>
                <div class="fix-box">
                    <strong>How to fix:</strong><br>
                    1. Check your browser's site settings.<br>
                    2. Enable JavaScript for this website.<br>
                    3. Turn off aggressive script-blocking extensions.
                </div>
            </div>
        </div>
    </noscript>

    <!-- Telegram Pop-up -->
    <div id="mz-overlay">
        <div class="mz-modal">
            <div class="mz-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.96 1.25-5.54 3.67-.52.36-.99.53-1.41.52-.46-.01-1.35-.26-2.01-.48-.81-.27-1.46-.42-1.4-.88.03-.23.35-.47.96-.73 3.76-1.64 6.27-2.72 7.52-3.24 3.57-1.48 4.32-1.74 4.81-1.75.11 0 .35.03.48.14.11.09.14.22.15.33-.01.03-.01.12 0 .17z"/></svg>
            </div>
            <h2>Created By<span class="mz-highlight">MODZONE</span>Telegram Channel</h2>
            <p>Join the channel to unlock live streams</p>
            <button id="mz-join-btn" class="mz-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                JOIN NOW
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" style="display: none;">
        <header>
            <h1>FanCode Corner</h1>
            <p>Live matches aggregated from community sources</p>
        </header>
        <div class="alert-banner">
            💡 <strong>Note:</strong> Tap <strong>Open App</strong> to play seamlessly in <a href="https://play.google.com/store/apps/details?id=com.pratyush.nsplayer" target="_blank">NS Player</a>.
        </div>
        <div id="status">Connecting to server API...</div>
        <div class="grid" id="match-grid"></div>
    </div>

    <script>
        let securityViolation = "";
        let unlocked = false;

        function triggerLockdown(htmlContent) {
            securityViolation = true;
            document.body.innerHTML = `<div style="background:#0f172a;height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;">${htmlContent}</div>`;
        }

        // Strict Network Scanner with Exact Error Logging
        async function testNetwork() {
            try {
                const res = await fetch('https://ipwhois.app/json/', { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP Error: Status ${res.status}`);
                const data = await res.json();
                
                if (data.country_code && data.country_code !== 'IN') {
                    triggerLockdown(`
                        <div class="block-card">
                            <h2>🚨 Geo-Restriction</h2>
                            <p>This service is strictly limited to users currently inside India.</p>
                            <div class="fix-box">
                                Detected Country: <b>${data.country || 'Unknown'}</b><br>
                                If you are in India, please disconnect your VPN.
                            </div>
                            <button onclick="location.reload()" class="btn btn-blue" style="margin-top:20px; width:100%;">Reload Page</button>
                        </div>
                    `);
                } else if (data.security && (data.security.vpn || data.security.proxy || data.security.tor)) {
                    triggerLockdown(`
                        <div class="block-card">
                            <h2>🚨 VPN / Proxy Detected</h2>
                            <p>You are using a masked network connection.</p>
                            <div class="fix-box">
                                <strong>How to fix:</strong><br>
                                1. Disconnect your <b>VPN App</b> (e.g. TurboVPN, ExpressVPN).<br>
                                2. Disable iCloud Private Relay or Tor.<br>
                                3. Switch back to your standard Mobile Data or Wi-Fi.
                            </div>
                            <button onclick="location.reload()" class="btn btn-blue" style="margin-top:20px; width:100%;">Reload Page</button>
                        </div>
                    `);
                }
            } catch (error) {
                // Now displays the exact JavaScript error message directly in the UI
                triggerLockdown(`
                    <div class="block-card">
                        <h2>🚨 Network Check Blocked</h2>
                        <p>Your device's DNS, browser, or Firewall is actively blocking our security check.</p>
                        <div class="error-log">Exact Error:<br>${error.message || error}</div>
                        <div class="fix-box">
                            <strong>How to fix (Android):</strong><br>
                            1. Go to your phone <b>Settings</b> > <b>Network & Internet</b>.<br>
                            2. Tap <b>Private DNS</b> and set it to <b>Off</b>.<br>
                            3. Turn off Brave Shields, AdGuard, or tracker blockers for this site.
                        </div>
                        <button onclick="location.reload()" class="btn btn-blue" style="margin-top:20px; width:100%;">Reload Page</button>
                    </div>
                `);
            }
        }

        testNetwork();

        const joinBtn = document.getElementById('mz-join-btn');
        joinBtn.addEventListener('click', () => {
            window.open('https://t.me/modzone01', '_blank');
            document.getElementById('mz-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            unlocked = true;
            fetchStreams();
        });

        // Master Guard Loop
        setInterval(() => {
            if (!securityViolation && !unlocked && !document.getElementById('mz-overlay')) {
                triggerLockdown(`
                    <div class="block-card">
                        <h2>🚨 Verification Bypassed</h2>
                        <p>You attempted to close or delete the Telegram verification prompt.</p>
                        <button onclick="location.reload()" class="btn btn-blue" style="margin-top:20px; width:100%;">Reload Page</button>
                    </div>
                `);
            }
        }, 500);

        async function fetchStreams() {
            if (securityViolation) return;
            try {
                const res = await fetch('/api/streams');
                const data = await res.json();
                const grid = document.getElementById('match-grid');
                const status = document.getElementById('status');

                if (data.status !== 'success' || !data.matches || data.matches.length === 0) {
                    status.style.display = 'block';
                    status.textContent = 'No live matches found at the moment.';
                    return;
                }

                status.style.display = 'none';
                grid.innerHTML = '';

                data.matches.forEach((match) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const imgTag = match.src_image ? `<img src="${match.src_image}" class="card-img" onerror="this.style.display='none'">` : '';
                    const cleanUrl = match.stream_url.replace(/^https?:\/\//, '');
                    const intentUrl = `intent://${cleanUrl}#Intent;action=android.intent.action.VIEW;scheme=https;type=application/x-mpegURL;end;`;

                    card.innerHTML = `
                        <div class="card-img-container">${imgTag}<div class="live-badge">LIVE</div></div>
                        <div class="card-content">
                            <div class="match-title">${match.title}</div>
                            <div class="button-group">
                                <a href="${intentUrl}" class="btn">▶ Open App</a>
                                <button class="btn btn-blue" onclick="copyToClipboard('${match.stream_url}')">📋 Copy</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                document.getElementById('status').textContent = 'Failed to load streams from API.';
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => alert('Link Copied!')).catch(() => alert('Failed to copy.'));
        }
    </script>
</body>
</html>
